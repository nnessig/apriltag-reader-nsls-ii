[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vimba-apriltag-reader"
version = "0.1.0"
description = "AprilTag detection, pose estimation, and camera calibration for Allied Vision (Vimba X) cameras, with ROS 2 publishing."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "LICENSE_README"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-contrib-python>=4.9,<4.14",
    "pupil-apriltags",
]

[project.scripts]
apriltag-runner = "apriltag_reader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ROS 2 (rclpy etc.) and vmbpy are not pip dependencies: ROS 2 comes from the
# container and vmbpy from the Vimba X SDK wheel. Both are optional at import
# time. Runtime dependencies are mirrored in requirements.txt for the Dockerfile.

[dependency-groups]
test = [
    "pytest>=8",
]
dev = [
    { include-group = "test" },
    "pre-commit",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
log_level = "INFO"
testpaths = ["tests"]
pythonpath = ["src"]
